# Local stack that mirrors production: PostgreSQL (stand-in for RDS) + the
# backend container (which also serves the built frontend).
#
#   cp .env.example .env      # add your GROQ_API_KEY
#   docker compose up --build
#   open http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_research"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_research
      FRONTEND_ORIGIN: http://localhost:8000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - appdata:/srv/backend/data

volumes:
  pgdata:
  appdata:
